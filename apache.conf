<VirtualHost *:8000>
    DocumentRoot /app/data/public
    DirectoryIndex index.php
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
    Timeout 600

    <Directory /app/data/public>
        Options +FollowSymLinks -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # iTop's installer is protected even before its first administrator exists.
    <LocationMatch "^/setup(?:/|$)">
        AuthType Basic
        AuthName "iTop installation"
        AuthUserFile /app/data/setup.htpasswd
        Require valid-user
    </LocationMatch>

    <DirectoryMatch "^/app/data/public/(conf|data|log)(/|$)">
        AllowOverride None
        Require all denied
    </DirectoryMatch>

    Alias /cloudron-health /app/code/health.php
    <Directory /app/code>
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
